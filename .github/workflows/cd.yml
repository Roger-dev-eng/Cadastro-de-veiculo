name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pipeline-de-dados-fipe:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pipeline-de-dados-fipe:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Render secrets not set, failing"
            exit 1
          fi
          echo "Triggering deploy on Render for service $RENDER_SERVICE_ID"
          resp=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$resp" -ge 200 ] && [ "$resp" -lt 300 ]; then
            echo "Render deploy triggered"
          else
            echo "Render API returned HTTP $resp"
            exit 1
          fi

      - name: Notify Slack on success
        if: ${{ success() }}
        run: |
          payload=$(jq -n --arg t "Deploy to Render succeeded" --arg repo "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA::8}" '{text: ($t + " - " + $repo + "@" + $sha)}')
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" ${{ secrets.SLACK_WEBHOOK }} || true

      - name: Notify Slack on failure
        if: ${{ failure() }}
        run: |
          payload=$(jq -n --arg t "Deploy to Render FAILED" --arg repo "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA::8}" '{text: ($t + " - " + $repo + "@" + $sha)}')
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" ${{ secrets.SLACK_WEBHOOK }} || true
