[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-de-dados-fipe"
version = "0.1.0"
description = "Pipeline de dados FIPE"
requires-python = ">=3.13"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]